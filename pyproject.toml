[project]
name = "hivemind-mcp"
version = "0.1.0"
description = "MCP server for Apache Hive Metastore — read-only discovery tools for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

keywords = [
    "mcp",
    "hive",
    "hive-metastore",
    "hms",
    "thrift",
    "fastmcp",
    "model-context-protocol",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]

dependencies = [
    "fastmcp>=2.0,<3.0",
    "thrift>=0.20,<1.0",
    "python-dotenv>=1.0,<2.0",
    # Optional HS2 EXPLAIN enrichment. PyHive speaks the HiveServer2 protocol so we
    # do not have to generate TCLIService Thrift stubs ourselves.
    "pyhive[hive]>=0.7,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
hivemind-mcp = "hivemind.hivemind_server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hivemind*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]